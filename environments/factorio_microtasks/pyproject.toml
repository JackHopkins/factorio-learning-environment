[project]
name = "factorio-microtasks"
version = "0.1.0"
description = "Engine-verified Factorio microtasks for agent evaluation and RL bootstrapping."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "WASLab" }]
keywords = ["factorio", "rlvr", "agents", "benchmark", "verifiers"]
dependencies = [
    "verifiers>=0.2.1,<0.4",
    "factorio-learning-environment @ git+https://github.com/HumanDotPy/factorio-learning-environment.git@7344674b6d6fb323a30cfb8c48b120af6277f00b",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorio_microtasks"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.verifiers.eval]
num_examples = 21
rollouts_per_example = 1
