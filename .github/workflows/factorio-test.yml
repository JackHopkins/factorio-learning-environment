name: Factorio Server Tests
on:
  pull_request:
    paths:
      - 'fle/run.py'
      - 'fle/env/**'
      - 'fle/cluster/**'
      - 'fle/envd/**'
      - 'fle/integrations/**'
      - 'factorio_v1/**'
      - 'integrations/prime/**'
      - 'pyproject.toml'
      - 'tests/test_run.py'
      - 'tests/test_cluster.py'
      - 'tests/test_game_control.py'
      - 'tests/envd/**'
      - 'tests/prime/**'
      - 'tests/actions/**'
      - 'tests/connect/**'
      - '.github/workflows/factorio-test.yml'
  workflow_dispatch:

jobs:
  test-cluster-command:
    name: Cluster command (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Python dependencies
        run: uv sync --dev --extra prime

      - name: Test cross-platform cluster command
        run: uv run pytest -q tests/test_run.py tests/test_cluster.py tests/test_game_control.py tests/envd tests/prime

  test-factorio:
    name: Ubuntu Factorio integration
    needs: test-cluster-command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Verify scenario exists
        run: |
          # Check that the scenario directory exists
          if [ ! -d "./fle/cluster/scenarios/default_lab_scenario" ]; then
            echo "❌ Scenario directory not found at ./cluster/scenarios/default_lab_scenario"
            exit 1
          fi
          echo "✓ Found scenario directory"
          ls -la ./fle/cluster/scenarios/default_lab_scenario

      - name: Install Python dependencies
        run: |
          uv sync --dev

      - name: Start 4 Factorio servers
        run: |
          uv run fle cluster start -n 4

      - name: Run Python tests (4 workers)
        run: |
          uv run pytest -n 4 --dist=load -v -s --tb=short tests/actions/
        env:
          FACTORIO_HOST: localhost
          PYTHONUNBUFFERED: 1

      - name: Show test logs on failure
        if: failure()
        run: |
          echo "=== Factorio container logs ==="
          uv run fle cluster logs factorio_0 | tail -n 100
          uv run fle cluster logs factorio_1 | tail -n 100
          uv run fle cluster logs factorio_2 | tail -n 100
          uv run fle cluster logs factorio_3 | tail -n 100

      - name: Stop server
        if: always()
        run: |
          uv run fle cluster stop
